name: Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BROWSER_SMOKE_NATIVE: '1'
    steps:
      - uses: actions/checkout@v5
      - name: Provision matching native PHP CLI and FPM packages
        run: |
          # setup-php's cached CLI build does not enroll an apt repository for FPM.
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            php8.5-cli php8.5-fpm php8.5-pgsql php8.5-mbstring php8.5-xml \
            libnss3-tools openssl
      - uses: ./.github/actions/native-php
      - name: Set up locked Node runtime
        uses: actions/setup-node@v5
        with:
          node-version-file: client/package.json
          package-manager-cache: false
      - name: Explicit locked frontend and browser setup
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          mkdir -p .runs/build/reports/client
          npm install --global "npm@$(node -p "require('./client/package.json').engines.npm")" --ignore-scripts --no-fund --no-audit
          # Qualify only the selected tool directories, not the runner's entire ambient PATH.
          printf 'FIGHT_BUILD_TOOL_PATH=%s:%s:/usr/local/bin:/usr/bin:/bin\n' \
            "$(dirname "$(command -v node)")" "$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
          (
            cd client
            npm ci --ignore-scripts --no-fund --no-audit
            node scripts/dependencies.mjs record
            node node_modules/playwright/cli.js install --with-deps chromium
            npm run build
          )
      - name: Prepare disposable browser TLS and catcher prerequisites
        run: |
          php --version
          php-fpm8.5 --version
          php-fpm8.5 --modules
          mkdir -p var/browser-smoke/certs
          chmod 700 var/browser-smoke/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=Disposable CI Browser CA' \
            -keyout var/browser-smoke/certs/ca.key -out var/browser-smoke/certs/rootCA.pem 2>/dev/null
          openssl req -new -newkey rsa:2048 -nodes -subj '/CN=localhost' \
            -addext 'subjectAltName=DNS:localhost' \
            -keyout var/browser-smoke/certs/localhost-key.pem -out var/browser-smoke/certs/leaf.csr 2>/dev/null
          openssl x509 -req -in var/browser-smoke/certs/leaf.csr \
            -CA var/browser-smoke/certs/rootCA.pem -CAkey var/browser-smoke/certs/ca.key \
            -CAcreateserial -days 1 -copy_extensions copy \
            -out var/browser-smoke/certs/localhost.pem 2>/dev/null
          python3 -B scripts/browser_smoke_setup.py --native --ca var/browser-smoke/certs/rootCA.pem
          docker run --detach --name browser-smoke-nginx --network host \
            --mount "type=bind,source=$PWD/var/browser-smoke/default.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            --mount "type=bind,source=$PWD/var/browser-smoke/certs,target=/etc/nginx/certs,readonly" \
            --mount "type=bind,source=$PWD/var/client/build,target=/app/var/client/build,readonly" \
            nginx:1.30.7-alpine@sha256:bef154735288bc38d99fac41ae63730684bcc661503673a04a0f9bc526ba8598
          docker run --detach --name browser-smoke-mailcatcher \
            --publish 127.0.0.1:1025:1025 --publish 127.0.0.1:8025:8025 \
            --read-only --tmpfs /data:rw,nosuid,noexec,size=64m --tmpfs /tmp:rw,nosuid,noexec,size=16m \
            --env MP_DATABASE=/data/mailpit.db --env MP_DISABLE_VERSION_CHECK=true \
            axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
      - name: Run the sole canonical gate
        # Its Planning phase runs `php -n scripts/planning_portfolio.php` on this runner, not in Docker.
        run: php scripts/build.php
      - name: Remove disposable browser envelope and catcher
        if: always()
        run: |
          status=0
          docker rm --force browser-smoke-nginx browser-smoke-mailcatcher || status=$?
          rm -rf var/browser-smoke
          exit "$status"
      - name: Retain gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-gate
          include-hidden-files: true
          path: |
            .runs/build/[0-9]*/*.json
            .runs/build/[0-9]*/*.log
            .runs/build/reports/browser-smoke/summary.json
            .runs/build/reports/backend/*.json
            .runs/build/reports/backend/junit.xml
            .runs/build/reports/client/coverage/coverage-summary.json
            .runs/build/reports/client/*-artifacts.json
            .runs/build/reports/client/catalog-evidence/receipt.json
