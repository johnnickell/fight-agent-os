name: Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Explicit locked tooling and dependency setup
        run: |
          export FIGHT_AGENT_OS_USER="$(id -u):$(id -g)"
          printf 'FIGHT_AGENT_OS_USER=%s\n' "$FIGHT_AGENT_OS_USER" >> "$GITHUB_ENV"
          docker compose build web
          ./bin/composer install --no-interaction --prefer-dist --no-progress
          ./bin/client setup
          ./bin/up
          ./bin/openapi export
          ./bin/validations export
      - name: Run the sole canonical gate
        run: ./bin/build
      - name: Retain gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-gate
          include-hidden-files: true
          path: |
            .runs/build/*/*.json
            .runs/build/*/*.log
            .runs/backend-coverage/*.json
            .runs/backend-coverage/junit.xml
            .runs/client/coverage/coverage-summary.json
            .runs/client/*-artifacts.json
            .runs/client/catalog-evidence/receipt.json
      - name: Stop owned CI services
        if: always()
        run: ./bin/down
