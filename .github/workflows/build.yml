name: Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://agent_os_test:agent_os_test_ci@127.0.0.1:5432/agent_os_test
      TEST_DATABASE_URL: postgresql://agent_os_test:agent_os_test_ci@127.0.0.1:5432/agent_os_test
      TEST_DATABASE_ALLOWED_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v5
      - name: Set up native PHP and coverage
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, mbstring, dom, xml, xmlwriter, simplexml, sodium
          coverage: xdebug
          tools: composer:v2
          ini-values: xdebug.mode=off, date.timezone=UTC, memory_limit=512M, zend.assertions=1, error_reporting=E_ALL
        env:
          fail-fast: true
      - name: Set up locked Node runtime
        uses: actions/setup-node@v5
        with:
          node-version-file: client/package.json
          package-manager-cache: false
      - name: Explicit locked tooling and dependency setup
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/playwright"
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\n' "$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          mkdir -p .runs/build/reports/client
          npm install --global "npm@$(node -p "require('./client/package.json').engines.npm")" --ignore-scripts --no-fund --no-audit
          # Qualify only the selected tool directories, not the runner's entire ambient PATH.
          printf 'FIGHT_BUILD_TOOL_PATH=%s:%s:/usr/local/bin:/usr/bin:/bin\n' \
            "$(dirname "$(command -v node)")" "$(dirname "$(command -v npm)")" >> "$GITHUB_ENV"
          (
            cd client
            npm ci --ignore-scripts --no-fund --no-audit
            node scripts/dependencies.mjs record
            node node_modules/playwright/cli.js install --with-deps chromium
            npm run build
          )
          php scripts/openapi.php export
          php scripts/validations.php export
      - name: Prepare native guarded PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE agent_os_test LOGIN PASSWORD 'agent_os_test_ci' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          SQL
          sudo -u postgres createdb --owner=agent_os_test agent_os_test
      - name: Run the sole canonical gate
        run: php scripts/build.php
      - name: Retain gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-gate
          include-hidden-files: true
          path: |
            .runs/build/[0-9]*/*.json
            .runs/build/[0-9]*/*.log
            .runs/build/reports/backend/*.json
            .runs/build/reports/backend/junit.xml
            .runs/build/reports/client/coverage/coverage-summary.json
            .runs/build/reports/client/*-artifacts.json
            .runs/build/reports/client/catalog-evidence/receipt.json
