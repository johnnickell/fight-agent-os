name: Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Provision matching native PHP CLI and FPM packages
        shell: bash
        run: |
          # Ubuntu Noble setup: https://packages.sury.org/php/README.txt
          keyring="$RUNNER_TEMP/debsuryorg-archive-keyring.deb"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$keyring" https://packages.sury.org/debsuryorg-archive-keyring.deb
          sudo dpkg -i "$keyring"
          echo 'deb [signed-by=/usr/share/keyrings/debsuryorg-archive-keyring.gpg] https://packages.sury.org/php/ noble main' \
            | sudo tee /etc/apt/sources.list.d/sury-php.list
          sudo apt-get update --error-on=any
          # Provide php-config and Xdebug so setup-php configures the installed PHP instead of fetching it.
          sudo apt-get install --no-install-recommends --yes \
            php8.5-cli php8.5-fpm php8.5-pgsql php8.5-mbstring php8.5-xml \
            php8.5-dev php8.5-xdebug libnss3-tools openssl
          sudo update-alternatives --set php /usr/bin/php8.5
          sudo update-alternatives --set php-config /usr/bin/php-config8.5
          apt-cache policy php8.5-cli php8.5-fpm
      - name: Provision pinned native Nginx and Mailpit binaries
        run: |
          tools="$RUNNER_TEMP/fight-browser-tools"
          mkdir -p "$tools"
          cd "$tools"
          curl --fail --silent --show-error --location --output nginx.deb \
            'https://nginx.org/packages/ubuntu/pool/nginx/n/nginx/nginx_1.30.7-1~noble_amd64.deb'
          curl --fail --silent --show-error --location --output mailpit.tar.gz \
            'https://github.com/axllent/mailpit/releases/download/v1.27.10/mailpit-linux-amd64.tar.gz'
          sha256sum --check <<'SUMS'
          299c0e27743e9fce5c42313838cf65f6ab31c621a2927d0323d5bd022b98f9f9  nginx.deb
          5686314f7010da85f7f7266a3987399c19b64ccbb394f0bdfca5ee3228ea6837  mailpit.tar.gz
          SUMS
          dpkg-deb --extract nginx.deb nginx
          tar -xzf mailpit.tar.gz mailpit
          "$tools/nginx/usr/sbin/nginx" -v
          "$tools/mailpit" version
          printf '%s\n%s\n' "$tools" "$tools/nginx/usr/sbin" >> "$GITHUB_PATH"
          printf 'FIGHT_BROWSER_SMOKE_MIME_TYPES=%s\n' "$tools/nginx/etc/nginx/mime.types" >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-php
        env:
          update: 'false'
      - uses: ./.github/actions/native-client
      - name: Verify the native PHP packages used by the gate
        shell: bash
        run: |
          cli_package=$(dpkg-query -W -f='${Version}' php8.5-cli)
          fpm_package=$(dpkg-query -W -f='${Version}' php8.5-fpm)
          printf 'PHP package versions: CLI %s; FPM %s\n' "$cli_package" "$fpm_package"
          test "$cli_package" = "$fpm_package"
          test "$(readlink -f "$(command -v php)")" = /usr/bin/php8.5
          cli_version=$(php -r 'echo PHP_VERSION;')
          fpm_version=$(php-fpm8.5 --version | awk 'NR == 1 {print $2}')
          printf 'PHP binary versions: CLI %s; FPM %s\n' "$cli_version" "$fpm_version"
          [[ "$cli_version" == 8.5.* && "$cli_version" == "$fpm_version" ]]
          for extensions in "$(php -m)" "$(php-fpm8.5 -m)"; do
            for extension in pdo_pgsql pgsql mbstring dom xml xmlwriter SimpleXML; do
              grep --fixed-strings --line-regexp "$extension" <<< "$extensions"
            done
          done
      - name: Run the sole canonical gate with native browser suppliers
        run: |
          containers=$(docker ps --quiet)
          test -z "$containers"
          php scripts/browser_smoke_setup.php native php scripts/build.php
      - name: Check browser teardown and drop the job-owned test database and role
        if: always()
        run: |
          status=0
          if [[ -e var/browser-smoke || -L var/browser-smoke ]]; then
            echo 'Browser fixture files remain.' >&2
            status=1
          fi
          if ! listeners=$(ss -H -ltn '( sport = :1025 or sport = :8025 or sport = :18081 or sport = :18443 or sport = :19087 )') || [[ -n "$listeners" ]]; then
            echo 'Browser fixture listener absence could not be verified.' >&2
            status=1
          fi
          if ! containers=$(docker ps --quiet) || [[ -n "$containers" ]]; then
            echo 'Running container absence could not be verified.' >&2
            status=1
          fi
          if [[ "${FIGHT_CI_TEST_DB_CREATED:-}" == 1 ]]; then
            sudo -u postgres dropdb agent_os_test || status=1
          fi
          if [[ "${FIGHT_CI_TEST_ROLE_CREATED:-}" == 1 ]]; then
            sudo -u postgres dropuser agent_os_test || status=1
          fi
          exit "$status"
      - name: Retain gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-gate
          include-hidden-files: true
          path: |
            .runs/build/[0-9]*/*.json
            .runs/build/[0-9]*/*.log
            .runs/build/reports/browser-smoke/summary.json
            .runs/build/reports/backend/unit-coverage.json
            .runs/build/reports/backend/junit-*.xml
            .runs/build/reports/client/coverage/coverage-summary.json
            .runs/build/reports/client/*-artifacts.json
            .runs/build/reports/client/catalog-evidence/receipt.json
