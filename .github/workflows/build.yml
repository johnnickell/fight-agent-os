name: Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: fight-agent-os-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Disposable hosted runner budget, distinct from the local 20 GiB reserve default.
      FIGHT_STORAGE_RESERVE_BYTES: 2147483648
      FIGHT_STORAGE_ALLOCATION_BYTES: 4294967296
    steps:
      - uses: actions/checkout@v5
      - name: Explicit locked tooling and dependency setup
        run: |
          export FIGHT_AGENT_OS_USER="$(id -u):$(id -g)"
          printf 'FIGHT_AGENT_OS_USER=%s\n' "$FIGHT_AGENT_OS_USER" >> "$GITHUB_ENV"
          # Ephemeral CI-only keys stay private and outside uploaded gate reports.
          # No host/browser trust enrollment: only this job's curl uses the generated CA.
          python3 - <<'PY'
          import json, os, secrets
          os.umask(0o077)
          config = {
              'algorithm': 'HS256', 'issuer': 'https://agent-os.test',
              'audience': 'agent-os-api', 'active_kid': 'ci',
              'keys': [{'kid': 'ci', 'secret_hex': secrets.token_hex(32)}]
          }
          with open('.env', 'w') as env:
              env.write('APP_BROWSER_ORIGIN=https://localhost:18443\n')
              for name in ('APP_CSRF_MAC_KEY', 'APP_ACTIVATION_RATE_KEY', 'APP_AUTH_RATE_KEY'):
                  env.write(name + '=' + secrets.token_hex(32) + '\n')
              env.write("APP_ACCESS_TOKEN_CONFIG='" + json.dumps(config) + "'\n")
          os.chmod('.env', 0o600)
          PY
          mkdir -p var
          (
            umask 077
            mkdir -p var/https/certs var/https/ci
            openssl req -x509 -newkey rsa:2048 -nodes -days 2 \
              -subj '/CN=Fight ephemeral CI CA' \
              -addext 'basicConstraints=critical,CA:TRUE' \
              -addext 'keyUsage=critical,keyCertSign,cRLSign' \
              -keyout var/https/ci/ca-key.pem -out var/https/ci/ca.pem 2>/dev/null
            openssl req -new -newkey rsa:2048 -nodes -subj '/CN=localhost' \
              -keyout var/https/certs/localhost-key.pem -out var/https/ci/localhost.csr 2>/dev/null
            printf '%s\n' 'subjectAltName=DNS:localhost' 'basicConstraints=critical,CA:FALSE' \
              'keyUsage=critical,digitalSignature,keyEncipherment' 'extendedKeyUsage=serverAuth' \
              > var/https/ci/localhost.ext
            openssl x509 -req -days 2 -in var/https/ci/localhost.csr \
              -CA var/https/ci/ca.pem -CAkey var/https/ci/ca-key.pem -CAcreateserial \
              -extfile var/https/ci/localhost.ext -out var/https/certs/localhost.pem
            rm -f var/https/ci/ca-key.pem var/https/ci/ca.srl \
              var/https/ci/localhost.csr var/https/ci/localhost.ext
          )
          export CURL_CA_BUNDLE="$PWD/var/https/ci/ca.pem"
          printf 'CURL_CA_BUNDLE=%s\n' "$CURL_CA_BUNDLE" >> "$GITHUB_ENV"
          ./bin/up --build-only
          ./bin/composer install --no-interaction --prefer-dist --no-progress
          ./bin/client setup
          ./bin/client build
          ./bin/up
          ./bin/openapi export
          ./bin/validations export
      - name: Run the sole canonical gate
        run: ./bin/build
      - name: Retain gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-gate
          include-hidden-files: true
          path: |
            .runs/build/[0-9]*/*.json
            .runs/build/[0-9]*/*.log
            .runs/build/reports/backend/*.json
            .runs/build/reports/backend/junit.xml
            .runs/build/reports/client/coverage/coverage-summary.json
            .runs/build/reports/client/*-artifacts.json
            .runs/build/reports/client/catalog-evidence/receipt.json
      - name: Stop owned CI services
        if: always()
        run: |
          status=0
          docker compose --profile https down --volumes --remove-orphans || status=$?
          # Delete only this disposable job's private configuration and TLS material, even on failure.
          rm -f .env
          rm -rf var/https
          exit "$status"
