name: Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Explicit locked tooling and dependency setup
        run: |
          export FIGHT_AGENT_OS_USER="$(id -u):$(id -g)"
          printf 'FIGHT_AGENT_OS_USER=%s\n' "$FIGHT_AGENT_OS_USER" >> "$GITHUB_ENV"
          # Ephemeral CI-only keys stay private and outside uploaded gate reports.
          python3 - <<'PY'
          import json, os, secrets
          config = {
              'algorithm': 'HS256', 'issuer': 'https://agent-os.test',
              'audience': 'agent-os-api', 'active_kid': 'ci',
              'keys': [{'kid': 'ci', 'secret_hex': secrets.token_hex(32)}]
          }
          with open('.env', 'w') as env:
              env.write('APP_BROWSER_ORIGIN=https://agent-os.test\n')
              env.write('APP_CSRF_MAC_KEY=' + secrets.token_hex(32) + '\n')
              env.write("APP_ACCESS_TOKEN_CONFIG='" + json.dumps(config) + "'\n")
          os.chmod('.env', 0o600)
          PY
          docker compose build web
          ./bin/composer install --no-interaction --prefer-dist --no-progress
          ./bin/client setup
          ./bin/up
          ./bin/openapi export
          ./bin/validations export
      - name: Run the sole canonical gate
        run: ./bin/build
      - name: Retain gate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-gate
          include-hidden-files: true
          path: |
            .runs/build/*/*.json
            .runs/build/*/*.log
            .runs/backend-coverage/*.json
            .runs/backend-coverage/junit.xml
            .runs/client/coverage/coverage-summary.json
            .runs/client/*-artifacts.json
            .runs/client/catalog-evidence/receipt.json
      - name: Stop owned CI services
        if: always()
        run: ./bin/down
