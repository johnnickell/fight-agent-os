services:
  web:
    build:
      context: .
      dockerfile: etc/docker/cli/Dockerfile
    # Reap orphaned tool/browser children across repeated checks in this persistent service.
    init: true
    command: php -S 0.0.0.0:8080 -t public scripts/serve.php
    # Explicit setup selects the checkout owner; unset preserves existing service identity.
    user: "${FIGHT_AGENT_OS_USER:-}"
    depends_on:
      postgres:
        condition: service_healthy
      postgres_test:
        condition: service_healthy
    environment: &application-environment
      APP_ENV: ${APP_ENV:-development}
      APP_ACCESS_TOKEN_CONFIG: ${APP_ACCESS_TOKEN_CONFIG:-}
      APP_BROWSER_ORIGIN: ${APP_BROWSER_ORIGIN:-}
      APP_CSRF_MAC_KEY: ${APP_CSRF_MAC_KEY:-}
      APP_CREDENTIAL_DELIVERY_KEY: ${APP_CREDENTIAL_DELIVERY_KEY:-}
      APP_CREDENTIAL_DELIVERY_ADAPTER: ${APP_CREDENTIAL_DELIVERY_ADAPTER:-null}
      APP_INVITATION_RATE_WINDOW: ${APP_INVITATION_RATE_WINDOW:-60}
      APP_INVITATION_RATE_ISSUE_LIMIT: ${APP_INVITATION_RATE_ISSUE_LIMIT:-10}
      APP_INVITATION_RATE_STATUS_LIMIT: ${APP_INVITATION_RATE_STATUS_LIMIT:-60}
      APP_INVITATION_RATE_CAPACITY: ${APP_INVITATION_RATE_CAPACITY:-10000}
      APP_INVITATION_RATE_RETRY_LIMIT: ${APP_INVITATION_RATE_RETRY_LIMIT:-5}
      APP_INVITATION_RATE_RESEND_LIMIT: ${APP_INVITATION_RATE_RESEND_LIMIT:-3}
      APP_INVITATION_RATE_CORRECT_LIMIT: ${APP_INVITATION_RATE_CORRECT_LIMIT:-3}
      APP_ACTIVATION_ORIGIN: ${APP_ACTIVATION_ORIGIN:-}
      APP_ACTIVATION_PATH: ${APP_ACTIVATION_PATH:-}
      APP_PASSWORD_RESET_ORIGIN: ${APP_PASSWORD_RESET_ORIGIN:-}
      APP_PASSWORD_RESET_PATH: ${APP_PASSWORD_RESET_PATH:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent_os}:${POSTGRES_PASSWORD:-agent_os_local}@postgres:5432/${POSTGRES_DB:-agent_os}
      TEST_DATABASE_ALLOWED_HOST: postgres_test
      TEST_DATABASE_URL: postgresql://${POSTGRES_TEST_USER:-agent_os_test}:${POSTGRES_TEST_PASSWORD:-agent_os_test_local}@postgres_test:5432/${POSTGRES_TEST_DB:-agent_os_test}
    ports: ["127.0.0.1:${FIGHT_AGENT_OS_PORT:-18087}:8080"]
    # Checks can write only ignored reports/caches; source, locks and installed tools stay read-only.
    volumes:
      - .:/app:ro
      - ./.runs:/app/.runs
      - ./var:/app/var
      - ./.runs/cache/client/dependency-cache:/app/client/node_modules/.cache
      - ./.runs/cache/client/vite-temp:/app/client/node_modules/.vite-temp
    shm_size: 256mb
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  # Explicit dependency maintenance inherits web limits, not its read-only source mount.
  composer:
    profiles: [maintenance]
    extends:
      service: web
    image: ${COMPOSE_PROJECT_NAME:-fight-agent-os}-web
    command: composer
    ports: !reset []
    volumes:
      - type: bind
        source: .
        target: /app
        read_only: false

  https_php:
    profiles: [https]
    build:
      context: .
      dockerfile: etc/docker/fpm/Dockerfile
    environment: *application-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes: [".:/app:ro"]

  https:
    profiles: [https]
    image: nginx:1.28.3-alpine
    depends_on: [https_php]
    ports: ["127.0.0.1:18443:8443"]
    volumes:
      - type: bind
        source: ./var/client/build
        target: /app/var/client/build
        read_only: true
      - type: bind
        source: ./etc/docker/https/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./var/https/certs
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false

  # Explicit opt-in; mailbox is disposable and SMTP is never published to the host.
  mailcatcher:
    profiles: [mail]
    image: axllent/mailpit:v1.27.10@sha256:b1f1be18af530d939a11ee8820b379e0c88eeec204d904bfad68862adced3a5a
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 100
      MP_DISABLE_VERSION_CHECK: "true"
    ports: ["127.0.0.1:${FIGHT_AGENT_OS_MAIL_PORT:-18088}:8025"]
    read_only: true
    tmpfs: ["/data:rw,nosuid,noexec,size=64m", "/tmp:rw,nosuid,noexec,size=16m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_os}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent_os_local}
      POSTGRES_USER: ${POSTGRES_USER:-agent_os}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres_test:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-agent_os_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-agent_os_test_local}
      POSTGRES_USER: ${POSTGRES_TEST_USER:-agent_os_test}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres_data:
