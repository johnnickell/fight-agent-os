[global]
; Native foreground FPM owns its lifecycle; Docker collects master/worker diagnostics.
error_log = /proc/self/fd/2
log_limit = 16384
log_buffering = no

[www]
catch_workers_output = yes
decorate_workers_output = no
; Access paths can contain credentials; Nginx retains the ingress logging boundary.
access.log = /dev/null
; Two 512 MiB PHP workers leave headroom inside the 2 GiB local service budget.
pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 10s
pm.max_requests = 500
request_terminate_timeout = 60s
