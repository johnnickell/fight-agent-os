# Closed browser/API header boundary: no forwarded, original-authority or client-TLS assertions.
# Keep application denial inputs (method override, encoding, fetch metadata), never turn them into authority.
proxy_pass_request_headers off;
proxy_set_header Connection "";
proxy_set_header Accept $http_accept;
proxy_set_header Accept-Language $http_accept_language;
proxy_set_header Accept-Encoding $http_accept_encoding;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Content-Encoding $http_content_encoding;
proxy_set_header Authorization $http_authorization;
proxy_set_header Cookie $http_cookie;
proxy_set_header Origin $http_origin;
proxy_set_header Referer $http_referer;
proxy_set_header User-Agent $http_user_agent;
proxy_set_header X-CSRF-Proof $http_x_csrf_proof;
proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
proxy_set_header Sec-Fetch-User $http_sec_fetch_user;
proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
proxy_set_header X-HTTP-Method-Override $http_x_http_method_override;
proxy_set_header X-Method-Override $http_x_method_override;
proxy_set_header If-None-Match $http_if_none_match;
proxy_set_header If-Modified-Since $http_if_modified_since;
proxy_set_header Cache-Control $http_cache_control;
