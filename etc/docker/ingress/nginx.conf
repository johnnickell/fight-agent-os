pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    access_log off;
    # Upstream error diagnostics can contain private URLs. Use status/health instead.
    error_log /dev/null;
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    ssl_protocols TLSv1.2 TLSv1.3;
    server { listen 80 default_server; server_name _; return 421; }
    server { listen 443 ssl default_server; ssl_reject_handshake on; }
    include /etc/nginx/routes/*.conf;
}
