; Shared local CLI/HTTP/FPM diagnostics. Public errors stay generic.
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2
display_errors = Off
display_startup_errors = Off
html_errors = Off
zend.exception_ignore_args = On
memory_limit = 512M
date.timezone = UTC
zend.assertions = 1

; Enable explicitly with XDEBUG_MODE=debug; connect only for a debug trigger.
xdebug.mode = off
xdebug.start_with_request = trigger
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.discover_client_host = Off
xdebug.log_level = 0
