# Local development only. The TLS server owns the scheme and authority sent to PHP.
server {
    listen 8443 ssl default_server;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/localhost.pem;
    ssl_certificate_key /etc/nginx/certs/localhost-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Do not log request paths, query strings, cookies or authorization material.
    access_log off;

    # Reject wrong authority before canonicalizing FastCGI metadata.
    if ($http_host != "localhost:18443") {
        return 421;
    }

    location ~ /\. {
        return 404;
    }

    # Only hashed client assets are static. Manifests, maps and arbitrary files stay private.
    location ~ "^/build/(?:main|chunk)-[A-Z0-9]{8}\.(?:js|css)(?:\.LEGAL\.txt)?$" {
        root /app/public;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location /build/ {
        return 404;
    }

    location / {
        # Execute the front controller, never expose arbitrary files or scripts.
        # The stock include sends empty CONTENT_TYPE even for a bodyless GET.
        # Preserve absence so PHP does not invent a forbidden Content-Type header.
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param REQUEST_METHOD $request_method;
        fastcgi_param CONTENT_TYPE $content_type if_not_empty;
        fastcgi_param CONTENT_LENGTH $content_length if_not_empty;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REQUEST_SCHEME https;
        fastcgi_param HTTPS on;
        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE nginx;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param REMOTE_PORT $remote_port;
        fastcgi_param SERVER_ADDR $server_addr;
        fastcgi_param SERVER_PORT 18443;
        fastcgi_param SERVER_NAME localhost;
        fastcgi_param REDIRECT_STATUS 200;
        fastcgi_param HTTP_HOST localhost:18443;
        fastcgi_param HTTP_FORWARDED "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_pass https_php:9000;
    }
}
