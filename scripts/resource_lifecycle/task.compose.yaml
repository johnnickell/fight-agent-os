# Reviewed TASK isolation; compose.yaml continues to own images and resource limits.
services:
  web:
    ports: !reset []
    volumes: !override
      - ${FIGHT_TASK_CHECKOUT}:/app:ro
      - ${FIGHT_TASK_OUTPUT}/runs:/app/.runs
      - ${FIGHT_TASK_OUTPUT}/var:/app/var
      - ${FIGHT_TASK_OUTPUT}/cache:/app/client/node_modules/.cache
      - ${FIGHT_TASK_OUTPUT}/vite:/app/client/node_modules/.vite-temp
  composer:
    volumes: !override
      - ${FIGHT_TASK_CHECKOUT}:/app
      - ${FIGHT_TASK_OUTPUT}/runs:/app/.runs
      - ${FIGHT_TASK_OUTPUT}/var:/app/var
      - ${FIGHT_TASK_OUTPUT}/cache:/app/client/node_modules/.cache
      - ${FIGHT_TASK_OUTPUT}/vite:/app/client/node_modules/.vite-temp
  postgres:
    volumes: !reset []
    tmpfs: [/var/lib/postgresql/data]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
  postgres_test:
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
  https:
    ports: !reset []
  mailcatcher:
    ports: !reset []
