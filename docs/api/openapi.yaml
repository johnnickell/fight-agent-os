openapi: 3.0.3
info:
  title: Fight Agent OS representative API
  version: 0.1.0
  description: |
    Only GET /api/v1/auth/csrf is implemented here. This document is repository-only;
    no OpenAPI, Swagger UI or diagnostic route is enabled in any environment.
    JSON responses use exactly application/json, JSend and snake_case data fields.
    Safe correlation is exposed only in X-Correlation-ID, not in the JSON envelope.
    No login, refresh, logout, invitation, authenticated resource or persistence API
    is implied by the reusable schemas or the future Bearer scheme.
    CORS is absent: no approved cross-origin client or credentialed preflight exists.
    See planning/adr/0003-browser-authentication-security-profile.md in this repository.
servers:
  - url: /
    description: Same-origin HTTPS only; deployment must configure its exact trusted origin
security: []
paths:
  /api/v1/auth/csrf:
    get:
      operationId: getCsrfProof
      summary: Bootstrap a short-lived non-authoritative CSRF proof
      description: |
        Sends no request body and no Content-Type header. Any body or Content-Type
        is rejected before dispatch. Query strings are forbidden. The URI must match
        the configured HTTPS origin exactly; forwarded headers are not trusted.
        Origin is optional on this GET, but if present must match the configured origin.
        Sec-Fetch-Site is optional; when present it must be exactly same-origin.
        Duplicate Origin/Fetch headers and Access-Control-Request-Method are rejected.
        A valid nonce cookie is reused without Set-Cookie; missing/invalid nonce is
        replaced. Duplicate nonce entries, multiple Cookie headers or a Cookie header
        over 4096 bytes are rejected. Other cookies do not grant authority.
        Issuance neither authenticates nor rotates refresh credentials. Keep the proof
        only in volatile memory. Mutation verification belongs to later operations.
      security: []
      parameters:
        - name: Origin
          in: header
          required: false
          description: If supplied, exactly the externally configured trusted HTTPS origin
          schema:
            type: string
        - name: Sec-Fetch-Site
          in: header
          required: false
          schema:
            type: string
            enum: [same-origin]
        - name: X-Correlation-ID
          in: header
          required: false
          description: |
            Exactly one 32-character lowercase hexadecimal value is preserved.
            Invalid, duplicated or absent values are replaced, not rejected.
          schema:
            type: string
        - name: __Secure-agent_os_csrf
          in: cookie
          required: false
          description: |
            Browser-managed HttpOnly nonce, never a refresh credential. Canonical
            values are 64 lowercase hexadecimal characters; invalid values are replaced.
          schema:
            type: string
      responses:
        '200':
          description: |
            MAC proof bound to the nonce, origin and expiry (900 seconds). Set-Cookie
            appears only for a new nonce. The host-only browser-session cookie has
            no Domain, Expires or Max-Age. No refresh credential is returned.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Set-Cookie:
              description: Only on nonce creation/replacement; inaccessible to JavaScript
              schema:
                type: string
                pattern: '^__Secure-agent_os_csrf=[a-f0-9]{64}; Path=/api/v1/auth; Secure; HttpOnly; SameSite=Strict$'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    FutureAccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        FUTURE ONLY, not applied to bootstrap. One Authorization Bearer access token,
        held only in volatile memory, never URL/body/cookie or persistent browser storage.
        ADR 0003 requires HS256, full header/claim/key/time validation and authoritative
        user/session/version resolution. Those consumers are not yet implemented.
  headers:
    NoStore:
      required: true
      schema:
        type: string
        enum: [no-store]
    CorrelationId:
      required: true
      description: Safe client-supplied or generated correlation, exposed in the header only
      schema:
        type: string
        pattern: '^[a-f0-9]{32}$'
  schemas:
    CsrfSuccess:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          additionalProperties: false
          required: [proof, expires_at]
          properties:
            proof:
              type: string
              description: Non-authoritative MAC proof; no credential example is published
              pattern: '^[1-9][0-9]{0,9}\.[a-f0-9]{64}$'
            expires_at:
              type: integer
              format: int64
              minimum: 1
              maximum: 9999999999
              description: UTC Unix seconds; proof is valid strictly before this deadline
    ValidationFail:
      type: object
      additionalProperties: false
      required: [status, data]
      properties:
        status:
          type: string
          enum: [fail]
        data:
          type: object
          additionalProperties: false
          required: [fields]
          properties:
            fields:
              type: object
              minProperties: 1
              description: |
                Field paths map to unique nonempty message lists. Bootstrap uses body
                or cookie. The existing DTO mapper supports dotted snake_case paths
                such as body.profile_name; no body-bearing HTTP operation exists yet.
                OpenAPI 3.0 cannot constrain these dictionary key names.
              additionalProperties:
                type: array
                minItems: 1
                uniqueItems: true
                items:
                  type: string
                  minLength: 1
      example:
        status: fail
        data:
          fields:
            body: [Body is not allowed.]
    BootstrapValidationFail:
      allOf:
        - $ref: '#/components/schemas/ValidationFail'
        - properties:
            data:
              properties:
                fields:
                  type: object
                  minProperties: 1
                  maxProperties: 1
                  additionalProperties: false
                  properties:
                    body:
                      type: array
                      items:
                        type: string
                        enum: [Body is not allowed.]
                    cookie:
                      type: array
                      items:
                        type: string
                        enum: [Invalid cookie., Ambiguous cookie.]
    Error:
      type: object
      additionalProperties: false
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
          enum:
            - Bad request.
            - Unauthorized.
            - Forbidden.
            - Not found.
            - Method not allowed.
            - Conflict.
            - Gone.
            - Too many requests.
            - Internal server error.
    BadRequestError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - properties:
            message:
              enum: [Bad request.]
    ForbiddenError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - properties:
            message:
              enum: [Forbidden.]
    InternalError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - properties:
            message:
              enum: [Internal server error.]
    NotFoundError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - properties:
            message:
              enum: [Not found.]
    MethodNotAllowedError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - properties:
            message:
              enum: [Method not allowed.]
  responses:
    BadRequest:
      description: |
        Bootstrap body/content-type or ambiguous cookie input gives JSend fail.
        A query string gives JSend error. No malformed-JSON POST is claimed.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/BootstrapValidationFail'
              - $ref: '#/components/schemas/BadRequestError'
    Forbidden:
      description: HTTPS/origin/Fetch Metadata/preflight rejection
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenError'
    InternalError:
      description: |
        Unexpected downstream failure. No exception message, stack, internal path or
        secret is returned. Correlation is in the header only; logs use safe metadata.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
    NotFound:
      description: API routing miss, not an operation or a generic lookup-to-404 promise
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'
    MethodNotAllowed:
      description: Unsupported method on a known API path; not a supported POST operation
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MethodNotAllowedError'
x-future-browser-security:
  status: Accepted ADR 0003 policy, not implemented authentication operations
  refresh: |
    Refresh credentials are opaque package-generated 256-bit values, not JWTs or Bearer
    tokens. Only a host-only __Secure- prefixed HttpOnly, Secure, SameSite=Strict cookie
    at Path=/api/v1/auth may transport them. Its exact name is not selected here.
    No Domain; ordinary cookie is session-only; remembered expiry cannot exceed the
    server absolute deadline. Never JSON, JavaScript, URL, header credential or example.
    No cookie apiKey scheme is offered for manual credential entry in documentation UI.
  mutations: |
    Future login/refresh/logout require exact trusted HTTPS Origin, same-origin Fetch
    Metadata when present, an explicit CSRF header with the nonce-bound unexpired proof,
    and bounded application/json objects. Bootstrap does not enforce future mutations.
    Future access credentials and CSRF proofs stay memory-only; responses are no-store.
x-mapper-only-failures:
  description: |
    Existing failure classification, NOT advertised bootstrap outcomes or new operations.
    Transport ValidationException -> 400 ValidationFail (body: Invalid input.);
    Domain ValidationException -> 422 ValidationFail (input: Invalid value.);
    AuthenticationRequired -> 401 Error (Unauthorized.);
    PermissionDenied -> 403 Error (Forbidden.);
    StateConflict/OptimisticConcurrencyException -> 409 Error (Conflict.);
    ResourceNotFound -> 404 Error (Not found.);
    framework equivalents plus 410 Gone. and 429 Too many requests. use Error.
    Unknown exceptions, including generic LookupException, become generic 500.
