# Docker teardown must finish before Worktrunk deletes source/configuration.
# The shared guarded remover admits only this exact project hook unattended.
# It inspects effective canonical/target hooks before per-invocation --yes;
# unknown/user/changed hooks refuse. No persistent approvals or hook bypass.
[pre-remove]
runtime = "{{ primary_worktree_path }}/bin/down --worktree {{ worktree_path }}"
